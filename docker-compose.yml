# Local PostgreSQL for development and for the tenant-isolation suite.
#
# The isolation tests are a release gate (NN-3) and a gate that silently skips is
# not a gate. `pnpm db:up` starts this, `pnpm verify` expects it.
services:
  postgres:
    image: postgres:16-alpine
    container_name: zerocorp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zerocorp
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zerocorp"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - zerocorp-pgdata:/var/lib/postgresql/data

volumes:
  zerocorp-pgdata:
